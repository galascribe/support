name: Idea
description: Suggest something you'd like Galascribe to do.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Galascribe. We read every idea; we can't promise to build each one.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the goal or the problem, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like it to work.
  - type: checkboxes
    id: search
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this hasn't been suggested.
          required: true
