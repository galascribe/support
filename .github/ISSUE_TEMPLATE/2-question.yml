name: Question
description: Ask how to do something in Galascribe.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Don't include private details. For questions about your account, billing or personal data, email [support@galascribe.com](mailto:support@galascribe.com).
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what have you tried so far?
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Page or site address
      description: Where you are in Galascribe, if it helps.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues for an answer.
          required: true
        - label: I've removed any private details.
          required: true
